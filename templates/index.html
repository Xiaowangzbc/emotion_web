<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <title>AI 情绪分析助手</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow mt-5 p-4">

                <h1 class="text-center mb-4">
                    AI 情绪分析助手 🤖
                </h1>

                <form method="post">

                    <div class="mb-3">

                        <input
                                type="text"
                                name="text"
                                class="form-control form-control-lg"
                                placeholder="请输入你现在的心情..."
                                required
                        >

                    </div>

                    <div class="d-grid">

                        <button
                                type="submit"
                                class="btn btn-primary btn-lg">

                            开始分析

                        </button>

                    </div>

                </form>

                {% if result %}

                <div class="alert alert-info mt-4">

                    <h4>
                        {{ result }}
                    </h4>

                </div>

                {% endif %}

                {% if ai_reply %}

                <div class="card mt-3 border-0 bg-light">

                    <div class="card-body">

                        <h5>AI 回复：</h5>

                        <p>
                            {{ ai_reply }}
                        </p>

                    </div>

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</div>

</body>

</html>
